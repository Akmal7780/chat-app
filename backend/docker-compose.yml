version: "3.9"

services:
  backend:
    build: .
    image: chat_app:latest

    command: >
      sh -c "
        sleep 5 &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py createadmin &&
        python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "

    volumes:
      - .:/app

    ports:
      - "8004:8000"

    env_file:
      - .env

    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

    depends_on:
      - redis
      - db
      - minio
      - clamav

    restart: unless-stopped

  celery:
    image: chat_app:latest

    command: celery -A config worker -l info -P solo

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

    depends_on:
      - redis
      - db
      - minio
      - clamav

    restart: unless-stopped

  celery-beat:
    image: chat_app:latest

    command: celery -A config beat -l info

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

    depends_on:
      - redis
      - db
      - minio
      - clamav

    restart: unless-stopped

  frontend:
    image: node:20

    working_dir: /app

    command: sh -c "npm install && npm run dev -- --host"

    volumes:
      - D:/Projects/chat-app/chat-frontend:/app

    ports:
      - "5177:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true

    restart: unless-stopped

  redis:
    image: redis:7

    ports:
      # Internal only — no legitimate reason for this to be reachable
      # from outside the host.
      - "127.0.0.1:6383:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  db:
    image: postgres:15

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      # Internal only — the backend talks to Postgres over the Docker
      # network; a host-exposed DB port is only useful for local admin
      # tools, which can still connect via 127.0.0.1.
      - "127.0.0.1:5436:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  minio:
    image: minio/minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      # 9000 (S3 API) stays public — file URLs served to the browser point
      # directly at PUBLIC_MINIO_URL (see .env). The admin console has no
      # reason to be reachable from outside the host.
      - "9004:9000"
      - "127.0.0.1:9005:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest

    container_name: chat_clamav

    ports:
      # Internal only — only the backend/Celery workers talk to ClamAV.
      - "127.0.0.1:3314:3310"

    volumes:
      - clamav_data:/var/lib/clamav

    environment:
      - CLAMAV_NO_FRESHCLAMD=false

    restart: unless-stopped

  # TURN/STUN relay for WebRTC calls behind strict NAT/firewalls (see
  # apps/messaging call signaling + chat-frontend CallContext.jsx). STUN
  # alone only helps two peers discover each other for a *direct* connection;
  # TURN relays the actual media when a direct connection isn't possible.
  coturn:
    image: coturn/coturn:latest

    container_name: chat_coturn

    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --realm=${TURN_REALM:-chatapp.local}
      --user=${TURN_USERNAME:-chatuser}:${TURN_PASSWORD:-changeme}
      --no-cli
      --min-port=49160
      --max-port=49200
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}

    # Deliberately public (unlike the other infra services above) — a TURN
    # relay only works if clients behind arbitrary NATs can reach it.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  clamav_data: